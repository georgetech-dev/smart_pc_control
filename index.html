<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>PC Control</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./power.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; font-family: Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:#08101f; color:#f8fafc; }
    header { position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between;
      padding:16px max(18px,env(safe-area-inset-left)); background:rgba(8,16,31,.92);
      border-bottom:1px solid #263449; backdrop-filter:blur(15px); }
    header h1 { margin:0; font-size:1.15rem; }
    main { width:min(100%,760px); margin:auto; padding:22px 18px 50px; }
    .card { margin-bottom:18px; padding:20px; border:1px solid #27364d; border-radius:20px;
      background:linear-gradient(145deg,#111c2f,#0c1628); box-shadow:0 14px 35px rgba(0,0,0,.22); }
    h2 { margin:0 0 14px; font-size:1.2rem; }
    p { color:#b9c6d8; line-height:1.5; }
    label { display:block; margin:12px 0 7px; color:#dbe7f7; font-weight:650; }
    input { width:100%; min-height:48px; padding:11px 13px; border:1px solid #42526b; border-radius:12px;
      background:#08111f; color:#fff; font:inherit; }
    button { min-height:46px; padding:10px 15px; border:0; border-radius:12px; background:#2563eb;
      color:#fff; font:inherit; font-weight:750; cursor:pointer; }
    button.secondary { background:#334155; }
    button.danger { background:#b91c1c; }
    button.warning { background:#a16207; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    .row > * { flex:1 1 140px; }
    .hidden { display:none !important; }
    .message { margin:12px 0 0; padding:11px 13px; border-radius:11px; background:#17243a; color:#d9e5f5; }
    .message.error { background:#401b22; color:#fecdd3; }
    .device-head { display:flex; align-items:flex-start; justify-content:space-between; gap:15px; }
    .device-name { margin:0; font-size:1.25rem; }
    .status { display:inline-flex; align-items:center; gap:7px; margin-top:7px; color:#c8d5e7; }
    .dot { width:10px; height:10px; border-radius:50%; background:#64748b; }
    .dot.online { background:#22c55e; box-shadow:0 0 12px rgba(34,197,94,.7); }
    .dot.starting,.dot.stopping,.dot.restarting { background:#f59e0b; }
    .actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:18px; }
    .tokens { margin-top:16px; padding-top:15px; border-top:1px solid #2a3950; }
    .token { margin-top:10px; padding:12px; border-radius:12px; background:#07101d; overflow-wrap:anywhere;
      color:#bfdbfe; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:.85rem; }
    small { color:#91a2b8; }
    @media (min-width:640px) { .actions { grid-template-columns:repeat(4,minmax(0,1fr)); } }
  </style>
</head>
<body>
<header>
  <h1>GeorgeTech PC Control</h1>
  <button id="signOut" class="secondary hidden">Sign out</button>
</header>
<main>
  <section id="loginCard" class="card">
    <h2>Sign in</h2>
    <p>Use the existing Supabase account that will own and control the PC.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" style="width:100%;margin-top:16px">Sign in</button>
    </form>
    <div id="loginMessage" class="message hidden"></div>
  </section>

  <section id="setupCard" class="card hidden">
    <h2>Add Dell XPS</h2>
    <form id="deviceForm">
      <label for="deviceName">Device name</label>
      <input id="deviceName" value="Dell XPS" required>
      <label for="mac">MAC address</label>
      <input id="mac" value="D0:8E:79:0A:4C:DB" required>
      <label for="broadcast">Broadcast address</label>
      <input id="broadcast" value="192.168.1.255" required>
      <div class="row">
        <div><label for="wolPort">WOL port</label><input id="wolPort" type="number" value="9" min="1" max="65535"></div>
        <div><label for="delay">Shutdown delay</label><input id="delay" type="number" value="15" min="0" max="300"></div>
      </div>
      <button type="submit" style="width:100%;margin-top:16px">Add PC</button>
    </form>
    <div id="setupMessage" class="message hidden"></div>
  </section>

  <section id="devices"></section>
</main>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from './config.js';

  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });

  const els = {
    loginCard: document.querySelector('#loginCard'), setupCard: document.querySelector('#setupCard'),
    devices: document.querySelector('#devices'), signOut: document.querySelector('#signOut'),
    loginForm: document.querySelector('#loginForm'), deviceForm: document.querySelector('#deviceForm'),
    loginMessage: document.querySelector('#loginMessage'), setupMessage: document.querySelector('#setupMessage')
  };

  let currentSession = null;
  let refreshTimer = null;

  function message(el, text, isError=false) {
    el.textContent = text;
    el.classList.toggle('error', isError);
    el.classList.toggle('hidden', !text);
  }

  function onlineState(device) {
    if (!device.last_seen) return { online:false, label:device.last_state || 'unknown' };
    const age = Date.now() - new Date(device.last_seen).getTime();
    if (age < 90000) return { online:true, label:'online' };
    if (['starting','stopping','restarting'].includes(device.last_state) && age < 180000) {
      return { online:false, label:device.last_state };
    }
    return { online:false, label:'offline' };
  }

  async function command(deviceId, action) {
    if (['shutdown','restart'].includes(action)) {
      const label = action === 'shutdown' ? 'shut down' : 'restart';
      if (!confirm(`Are you sure you want to ${label} this PC?`)) return;
    }
    const { error } = await supabase.rpc('create_pc_command', {
      p_device_id: deviceId, p_command: action, p_source: 'mobile'
    });
    if (error) alert(error.message); else await loadDevices();
  }

  async function issueToken(deviceId, type, output) {
    const { data, error } = await supabase.rpc('issue_pc_agent_token', {
      p_device_id: deviceId, p_agent_type: type
    });
    if (error) { output.textContent = error.message; return; }
    output.textContent = data;
    output.classList.remove('hidden');
    try { await navigator.clipboard.writeText(data); } catch {}
    alert(`${type === 'nas' ? 'NAS' : 'Windows'} token generated and copied where supported. Save it now; it cannot be shown again.`);
  }

  function deviceCard(device) {
    const state = onlineState(device);
    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `
      <div class="device-head">
        <div><h2 class="device-name"></h2><div class="status"><span class="dot"></span><span class="state-label"></span></div></div>
        <small class="seen"></small>
      </div>
      <div class="actions">
        <button data-command="wake">Turn on</button>
        <button data-command="shutdown" class="danger">Shut down</button>
        <button data-command="restart" class="warning">Restart</button>
        <button data-command="cancel_shutdown" class="secondary">Cancel</button>
      </div>
      <div class="tokens">
        <small>Generate each token once, then paste it into the relevant agent configuration.</small>
        <div class="row" style="margin-top:10px">
          <button class="secondary nas-token-button">Generate NAS token</button>
          <button class="secondary windows-token-button">Generate Windows token</button>
        </div>
        <div class="token nas-token hidden"></div>
        <div class="token windows-token hidden"></div>
      </div>`;
    card.querySelector('.device-name').textContent = device.name;
    const dot = card.querySelector('.dot');
    dot.classList.add(state.label);
    if (state.online) dot.classList.add('online');
    card.querySelector('.state-label').textContent = state.label;
    card.querySelector('.seen').textContent = device.last_seen ? `Last seen ${new Date(device.last_seen).toLocaleString()}` : 'Not seen yet';
    card.querySelectorAll('[data-command]').forEach(button => {
      button.addEventListener('click', () => command(device.id, button.dataset.command));
    });
    card.querySelector('.nas-token-button').addEventListener('click', () =>
      issueToken(device.id, 'nas', card.querySelector('.nas-token')));
    card.querySelector('.windows-token-button').addEventListener('click', () =>
      issueToken(device.id, 'windows', card.querySelector('.windows-token')));
    return card;
  }

  async function loadDevices() {
    if (!currentSession) return;
    const { data, error } = await supabase.from('pc_devices')
      .select('id,name,mac_address,broadcast_address,wol_port,shutdown_delay,last_seen,last_state,enabled')
      .order('created_at');
    els.devices.replaceChildren();
    if (error) {
      const div = document.createElement('div'); div.className='message error'; div.textContent=error.message;
      els.devices.append(div); return;
    }
    els.setupCard.classList.toggle('hidden', data.length > 0);
    data.forEach(device => els.devices.append(deviceCard(device)));
  }

  async function applySession(session) {
    currentSession = session;
    const signedIn = Boolean(session);
    els.loginCard.classList.toggle('hidden', signedIn);
    els.signOut.classList.toggle('hidden', !signedIn);
    els.setupCard.classList.toggle('hidden', !signedIn);
    if (signedIn) {
      await loadDevices();
      clearInterval(refreshTimer);
      refreshTimer = setInterval(loadDevices, 10000);
    } else {
      clearInterval(refreshTimer);
      els.devices.replaceChildren();
    }
  }

  els.loginForm.addEventListener('submit', async event => {
    event.preventDefault(); message(els.loginMessage, 'Signing in…');
    const { data, error } = await supabase.auth.signInWithPassword({
      email: document.querySelector('#email').value.trim(),
      password: document.querySelector('#password').value
    });
    if (error) message(els.loginMessage, error.message, true);
    else { message(els.loginMessage, ''); await applySession(data.session); }
  });

  els.deviceForm.addEventListener('submit', async event => {
    event.preventDefault(); message(els.setupMessage, 'Adding device…');
    const { error } = await supabase.from('pc_devices').insert({
      name: document.querySelector('#deviceName').value.trim(),
      mac_address: document.querySelector('#mac').value.trim(),
      broadcast_address: document.querySelector('#broadcast').value.trim(),
      wol_port: Number(document.querySelector('#wolPort').value),
      shutdown_delay: Number(document.querySelector('#delay').value)
    });
    if (error) message(els.setupMessage, error.message, true);
    else { message(els.setupMessage, ''); await loadDevices(); }
  });

  els.signOut.addEventListener('click', async () => { await supabase.auth.signOut(); await applySession(null); });
  supabase.auth.onAuthStateChange((_event, session) => applySession(session));
  const { data: { session } } = await supabase.auth.getSession();
  await applySession(session);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js').catch(() => {});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08101f">
  <title>Connect Alexa</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:20px; background:#08101f; color:#fff; }
    main { width:min(100%,430px); padding:25px; background:#111c2f; border:1px solid #31415a; border-radius:20px; }
    h1 { margin-top:0; }
    p,li { color:#c6d3e5; line-height:1.5; }
    label { display:block; margin:12px 0 6px; font-weight:700; }
    input { width:100%; min-height:48px; padding:11px; border:1px solid #465977; border-radius:11px; background:#07101d; color:#fff; font:inherit; }
    button { width:100%; min-height:48px; margin-top:12px; border:0; border-radius:11px; background:#2563eb; color:#fff; font:inherit; font-weight:750; cursor:pointer; }
    button.secondary { background:#334155; }
    button:disabled { opacity:.6; cursor:wait; }
    .hidden { display:none; }
    .error { color:#fecaca; }
    .success { color:#bbf7d0; }
  </style>
</head>
<body>
<main>
  <h1>Connect Alexa</h1>

  <section id="loading">
    <p id="loadingText">Loading the account-linking request…</p>
  </section>

  <section id="login" class="hidden">
    <p>Sign in with your existing PC Control account.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button id="signInButton" type="submit">Sign in</button>
    </form>
    <p id="loginError" class="error"></p>
  </section>

  <section id="consent" class="hidden">
    <p><strong id="clientName">Alexa</strong> wants permission to:</p>
    <ul id="scopes"></ul>
    <button id="approve" type="button">Allow</button>
    <button id="deny" type="button" class="secondary">Cancel</button>
    <p id="consentStatus"></p>
  </section>
</main>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from '../../config.js';

  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  });

  const queryAuthorizationId = new URLSearchParams(location.search).get('authorization_id');
  let activeAuthorizationId = queryAuthorizationId;
  let decisionInProgress = false;

  const loading = document.querySelector('#loading');
  const loadingText = document.querySelector('#loadingText');
  const login = document.querySelector('#login');
  const consent = document.querySelector('#consent');
  const approveButton = document.querySelector('#approve');
  const denyButton = document.querySelector('#deny');
  const consentStatus = document.querySelector('#consentStatus');

  function showOnly(section) {
    loading.classList.toggle('hidden', section !== loading);
    login.classList.toggle('hidden', section !== login);
    consent.classList.toggle('hidden', section !== consent);
  }

  function showLoading(message) {
    loadingText.textContent = message;
    loadingText.className = '';
    showOnly(loading);
  }

  function showFatalError(message) {
    loadingText.textContent = message;
    loadingText.className = 'error';
    showOnly(loading);
  }

  function redirectToAlexa(url) {
    showLoading('Returning to Alexa…');
    location.replace(url);
  }

  async function showRequest() {
    if (!queryAuthorizationId) {
      showFatalError('Missing authorization request. Return to the Alexa app and enable the skill again.');
      return;
    }

    showLoading('Loading the account-linking request…');

    const { data: { session }, error: sessionError } = await supabase.auth.getSession();

    if (sessionError) {
      showFatalError(sessionError.message);
      return;
    }

    if (!session) {
      showOnly(login);
      return;
    }

    const { data, error } = await supabase.auth.oauth.getAuthorizationDetails(queryAuthorizationId);

    if (error || !data) {
      showFatalError(error?.message || 'The authorization request could not be loaded. Return to Alexa and try linking again.');
      return;
    }

    /*
      Supabase returns OAuthRedirect when this user has already granted
      consent to this OAuth client. In that case the authorization request
      has already been processed, so we must redirect immediately rather
      than displaying the Allow button again.
    */
    if (!('authorization_id' in data)) {
      redirectToAlexa(data.redirect_url);
      return;
    }

    activeAuthorizationId = data.authorization_id || queryAuthorizationId;

    document.querySelector('#clientName').textContent =
      data.client?.name || data.client_name || 'Amazon Alexa';

    const labels = {
      openid: 'Identify your linked account',
      email: 'Read your account email',
      profile: 'Read your basic profile'
    };

    const requestedScopes = (data.scope || '')
      .split(/\s+/)
      .filter(Boolean);

    const list = document.querySelector('#scopes');
    list.replaceChildren(...requestedScopes.map(scope => {
      const li = document.createElement('li');
      li.textContent = labels[scope] || scope;
      return li;
    }));

    consentStatus.textContent = '';
    consentStatus.className = '';
    showOnly(consent);
  }

  document.querySelector('#loginForm').addEventListener('submit', async event => {
    event.preventDefault();

    const signInButton = document.querySelector('#signInButton');
    const loginError = document.querySelector('#loginError');

    signInButton.disabled = true;
    signInButton.textContent = 'Signing in…';
    loginError.textContent = '';

    const { error } = await supabase.auth.signInWithPassword({
      email: document.querySelector('#email').value.trim(),
      password: document.querySelector('#password').value
    });

    if (error) {
      loginError.textContent = error.message;
      signInButton.disabled = false;
      signInButton.textContent = 'Sign in';
      return;
    }

    await showRequest();
  });

  async function makeDecision(decision) {
    if (decisionInProgress) return;
    decisionInProgress = true;

    approveButton.disabled = true;
    denyButton.disabled = true;
    consentStatus.textContent = decision === 'approve'
      ? 'Linking your account…'
      : 'Cancelling…';
    consentStatus.className = '';

    const result = decision === 'approve'
      ? await supabase.auth.oauth.approveAuthorization(activeAuthorizationId)
      : await supabase.auth.oauth.denyAuthorization(activeAuthorizationId);

    if (result.error) {
      consentStatus.textContent = result.error.message;
      consentStatus.className = 'error';
      decisionInProgress = false;
      approveButton.disabled = false;
      denyButton.disabled = false;
      return;
    }

    redirectToAlexa(result.data.redirect_url);
  }

  approveButton.addEventListener('click', () => makeDecision('approve'));
  denyButton.addEventListener('click', () => makeDecision('deny'));

  await showRequest();
</script>
</body>
</html>

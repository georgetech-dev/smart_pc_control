<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Connect Alexa</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; background:#08101f; color:#fff; }
    main { width:min(100%,430px); padding:25px; background:#111c2f; border:1px solid #31415a; border-radius:20px; }
    h1 { margin-top:0; } p,li { color:#c6d3e5; line-height:1.5; }
    label { display:block; margin:12px 0 6px; font-weight:700; }
    input { width:100%; min-height:48px; padding:11px; border:1px solid #465977; border-radius:11px; background:#07101d; color:#fff; font:inherit; }
    button { width:100%; min-height:48px; margin-top:12px; border:0; border-radius:11px; background:#2563eb; color:#fff; font:inherit; font-weight:750; }
    button.secondary { background:#334155; } .hidden { display:none; } .error { color:#fecaca; }
  </style>
</head>
<body>
<main>
  <h1>Connect Alexa</h1>
  <section id="loading"><p>Loading the account-linking request…</p></section>
  <section id="login" class="hidden">
    <p>Sign in with your existing PC Control account.</p>
    <form id="loginForm">
      <label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
      <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <p id="loginError" class="error"></p>
  </section>
  <section id="consent" class="hidden">
    <p><strong id="clientName">Alexa</strong> wants permission to:</p>
    <ul id="scopes"></ul>
    <button id="approve">Allow</button>
    <button id="deny" class="secondary">Cancel</button>
    <p id="consentError" class="error"></p>
  </section>
</main>
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from '../../config.js';

  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
  });
  const authorizationId = new URLSearchParams(location.search).get('authorization_id');
  const loading = document.querySelector('#loading');
  const login = document.querySelector('#login');
  const consent = document.querySelector('#consent');

  async function showRequest() {
    if (!authorizationId) { loading.innerHTML='<p class="error">Missing authorization request.</p>'; return; }
    const { data:{session} } = await supabase.auth.getSession();
    if (!session) { loading.classList.add('hidden'); login.classList.remove('hidden'); return; }
    const { data, error } = await supabase.auth.oauth.getAuthorizationDetails(authorizationId);
    if (error) { loading.innerHTML=`<p class="error">${error.message}</p>`; return; }
    document.querySelector('#clientName').textContent = data.client?.name || data.client_name || 'Amazon Alexa';
    const scopeString = data.scope || '';
    const labels = { openid:'Identify your linked account', email:'Read your account email', profile:'Read your basic profile' };
    const list = document.querySelector('#scopes');
    list.replaceChildren(...scopeString.split(/\s+/).filter(Boolean).map(scope => {
      const li=document.createElement('li'); li.textContent=labels[scope] || scope; return li;
    }));
    loading.classList.add('hidden'); login.classList.add('hidden'); consent.classList.remove('hidden');
  }

  document.querySelector('#loginForm').addEventListener('submit', async event => {
    event.preventDefault();
    const { error } = await supabase.auth.signInWithPassword({
      email:document.querySelector('#email').value.trim(), password:document.querySelector('#password').value
    });
    document.querySelector('#loginError').textContent = error?.message || '';
    if (!error) await showRequest();
  });

  document.querySelector('#approve').addEventListener('click', async () => {
    const { data, error } = await supabase.auth.oauth.approveAuthorization(authorizationId);
    if (error) document.querySelector('#consentError').textContent=error.message;
    else location.assign(data.redirect_url);
  });
  document.querySelector('#deny').addEventListener('click', async () => {
    const { data, error } = await supabase.auth.oauth.denyAuthorization(authorizationId);
    if (error) document.querySelector('#consentError').textContent=error.message;
    else location.assign(data.redirect_url);
  });
  await showRequest();
</script>
</body>
</html>
